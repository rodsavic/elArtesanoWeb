{% load static %}
<!DOCTYPE html>
{% load custom_filters %}
<html lang="es">
<head>
    <link rel="stylesheet" href="https://unpkg.com/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="icon" href="{% static 'images/favicon.ico' %}" type="image/x-icon">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesion - El artesano</title>
    <style>
        body {
            background: linear-gradient(135deg, #8b5e3c, #2f241d);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 15px;
        }

        .login-card {
            width: 100%;
            max-width: 400px;
            border: none;
            border-radius: 1rem;
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.25);
            background: white;
        }

        @media (min-width: 768px) {
            .login-card {
                max-width: 450px;
            }

            body {
                padding: 30px;
            }
        }

        @media (min-width: 992px) {
            .login-card {
                max-width: 500px;
            }
        }

        .card-body {
            padding: 2rem 1.5rem;
        }

        @media (max-width: 576px) {
            .card-body {
                padding: 1.5rem 1rem;
            }

            .logo-img {
                height: 80px !important;
            }
        }

        h2 {
            color: #3a2b20;
            font-weight: 600;
        }

        .form-control {
            border-radius: 0.5rem;
            border: 1px solid #d1c4c0;
            font-size: 16px;
        }

        .form-control:focus {
            border-color: #8b5e3c;
            box-shadow: 0 0 0 0.2rem rgba(139, 94, 60, 0.25);
        }

        .btn-crear {
            background-color: #8b5e3c;
            color: #fff;
            font-weight: bold;
            border-radius: 0.5rem;
            transition: background-color 0.3s ease;
            border: none;
            min-height: 48px;
        }

        .btn-crear:hover {
            background-color: #6f492e;
            color: #fff;
        }
    </style>
</head>
<body>
{% include 'base/messages.html' %}
<section class="py-3 py-md-5 w-100">
    <div class="container-fluid">
        <div class="row justify-content-center">
            <div class="col-12 d-flex justify-content-center">
                <div class="login-card">
                    <div class="card-body">
                        <div class="text-center mb-4">
                            <a href="#!">
                                <img src="{% static 'images/logo_real.png' %}" alt="El artesano"
                                     class="logo-img" style="height: 100px;">
                            </a>
                        </div>

                        <h2 class="fs-4 text-center mb-4">Iniciar sesion</h2>

                        <form method="POST">
                            {% csrf_token %}
                            <input type="hidden" name="next" value="{{ next }}">
                            <div class="row gy-3">
                                <div class="col-12">
                                    <div class="form-floating">
                                        {{ form.username|add_class:"form-control" }}
                                        <label for="{{ form.username.id_for_label }}">Nombre de usuario</label>
                                    </div>
                                </div>
                                <div class="col-12">
                                    <div class="form-floating">
                                        {{ form.password|add_class:"form-control" }}
                                        <label for="{{ form.password.id_for_label }}">Contrasena</label>
                                        <button
                                            type="button"
                                            class="btn btn-sm position-absolute top-50 end-0 translate-middle-y me-2"
                                            onclick="togglePassword()"
                                            tabindex="-1"
                                        >
                                            <i class="bi bi-eye"></i>
                                            <i class="bi bi-eye-slash"></i>
                                        </button>
                                    </div>
                                </div>
                                <div class="col-12">
                                    <div class="d-grid mt-4">
                                        <button class="btn btn-crear btn-lg" type="submit">Iniciar Sesion</button>
                                    </div>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
function togglePassword() {
    const input = document.getElementById("{{ form.password.id_for_label }}");
    const icon = event.currentTarget.querySelector("i");

    if (input.type === "password") {
        input.type = "text";
        icon.classList.replace("bi-eye", "bi-eye-slash");
    } else {
        input.type = "password";
        icon.classList.replace("bi-eye-slash", "bi-eye");
    }
}
</script>

</body>
</html>
